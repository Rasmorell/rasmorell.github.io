<style>
:root{
  --frame:#0f1a16;--frame-line:#2a4136;--frame-text:#f4efe4;--frame-muted:#bdb4a0;
  --bg:#0f1a16;--card:#1b2e25;--card-line:#2a4136;--ink:#ece5d4;--ink-muted:#bdb4a0;--sunk:#142019;
  --field:#12201a;--field-line:#6b8a7c;--gold:#e3a72f;--gold-ink:#e3a72f;--on-gold:#0f1a16;
  --leaf:#a5cf73;--leaf-soft:#1f2d1a;--salvia:#1f2b24;--warn:#e98a64;--seed-low:#5a5446;--seed-ring:#8a7f6c;
  --shadow:none;--card-border:none;--mesa:#4a6358;
}
:root[data-theme="light"]{
  --frame:#e0e9e6;--frame-line:#c5d3cd;--frame-text:#16211c;--frame-muted:#4a5650;
  --bg:#e0e9e6;--card:#f2f6f4;--card-line:#c5d3cd;--ink:#16211c;--ink-muted:#4a5650;--sunk:#d0dcd7;
  --field:#f2f6f4;--field-line:#7d9187;--gold:#c98a1c;--gold-ink:#7a4f00;--on-gold:#16211c;
  --leaf:#3d621d;--leaf-soft:#e1e8cf;--salvia:#e4ebdc;--warn:#9c3c19;--seed-low:#a0aea8;--seed-ring:#889790;
  --shadow:0 1px 2px rgba(22,33,28,.05),0 10px 28px rgba(22,33,28,.07);--card-border:1px solid rgba(22,33,28,.1);--mesa:#d3dfda;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Literata,Georgia,'Times New Roman',serif}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
:root[data-theme="light"] :focus-visible{outline-color:#7a4f00}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Gloock,Georgia,serif;font-weight:400;text-wrap:balance;margin:0}
/* encabezado */
.mast{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--frame-line)}
.brand{display:flex;align-items:center;gap:8px;color:var(--frame-text);text-decoration:none;font-weight:600;font-size:15px;margin-right:auto;min-height:44px}
:root[data-theme="light"] .logo-night,:root:not([data-theme="light"]) .logo-day{display:none}
.icon-btn{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--frame-text);font:600 14.5px Literata,serif;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.icon-btn:hover{background:rgba(127,127,127,.12)}
/* portada */
.hero{padding:36px 0 22px}
.hero h1{font-size:clamp(31px,6vw,44px);line-height:1.06;letter-spacing:-.01em;color:var(--frame-text)}
.hero h1 em{font-style:normal;color:var(--gold-ink)}
:root:not([data-theme="light"]) .hero h1 em{color:var(--gold)}
.hero p{color:var(--frame-muted);max-width:40em;font-size:16.5px;margin:12px 0 0}
.hero.compacto{display:none}
.hero.compacto ~ #app{margin-top:40px}
.pills:has(.estilo-op){display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.pill.estilo-op{flex-direction:column;align-items:flex-start;gap:2px;border-radius:14px;padding:10px 14px;text-align:left}
.pill.estilo-op small{font-size:14px;line-height:1.35;opacity:.85}
.hero.compacto h1{font-size:clamp(24px,4.5vw,30px)}
.hero.compacto p{display:none}
/* recorrido */
.steps{display:flex;gap:6px;margin:6px 0 8px}
.steps i{flex:1;height:5px;border-radius:999px;background:var(--frame-line)}
.steps i.on{background:var(--gold)}
.steplabel{font-size:14.5px;font-weight:600;color:var(--frame-muted);margin:0 0 14px}
/* hojas */
.card{background:var(--card);border-radius:22px;padding:28px 30px;margin:0 0 24px;box-shadow:var(--shadow);border:var(--card-border)}
.card h2{font-size:26px;line-height:1.25;margin-bottom:6px}
.lead{color:var(--ink-muted);margin:0 0 20px;max-width:38em}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
label.f{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
input[type=number]{width:100%;font:16px Literata,serif;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:10px;padding:10px 12px;min-height:44px}
.hint{font-size:14.5px;color:var(--ink-muted);margin:6px 0 0}
.err{color:var(--warn);font-size:14px;margin:10px 0 0;min-height:1em}
.btn{font:600 15px Literata,serif;min-height:44px;padding:11px 22px;border-radius:999px;border:1px solid var(--field-line);background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:var(--sunk)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.link{border:0;text-decoration:underline;padding:11px 6px}
.nav{display:flex;gap:12px;justify-content:space-between;margin-top:24px;flex-wrap:wrap}
.nav .btn{min-width:140px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:15px Literata,serif;min-height:44px;padding:9px 16px;border-radius:999px;border:1px solid var(--field-line);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pill svg{flex:none}
.mut-cta{display:flex;gap:22px;align-items:center;border:1px solid var(--gold)}
.mut-cta-arte{flex:0 0 auto}
.mut-cta h2{margin-top:0}
.mut-instr{font:600 19px Literata,serif;margin:0 0 12px}
.btn[aria-disabled="true"]{opacity:.55}
.mut-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin:0 0 16px}
.dial{display:flex;flex-direction:column;gap:4px;min-width:220px;font-size:14.5px}
.dial input{accent-color:var(--gold);width:100%;min-height:32px}
.vestidos{list-style:none;padding:0;margin:0 0 10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.vest{border:1px solid var(--card-line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.vest.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.vest-btn{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;gap:5px;color:var(--ink);font:15px Literata,serif}
.vest-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.vest-arte{display:block;background:var(--mesa);border-radius:12px;padding:6px 18px}
.vest-arte svg,.vest-grande svg{display:block;width:100%;height:auto}
.vest .pick{align-self:flex-start;margin-top:auto;font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid var(--field-line)}
.vest.on .pick{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.vest .muta{min-height:44px;font-size:14px;padding:6px 12px}
.mutado{color:var(--gold-ink)}
.candados{margin:18px 0 0}
.candados .pills{margin-top:8px}
.candados .pill svg{flex:none}
.candados .pill .cerrado,.candados .pill[aria-pressed="true"] .abierto{display:none}
.candados .pill[aria-pressed="true"] .cerrado{display:inline}

:root:not([data-theme="light"]) .mutado{color:var(--gold)}
.mut-fin{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:24px;align-items:start}
.vest-grande{background:var(--mesa);border-radius:16px;padding:12px 28px;width:100%;box-sizing:border-box}
.genes{margin:0 0 8px;padding-left:18px}
.genes li{margin:3px 0}
.arbol{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sunk);border-radius:14px;padding:14px}
.arbol .hint{margin:6px 0 0}
.arbol-fila{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.arbol-n{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:110px;text-align:center;font-size:14px;color:var(--ink-muted)}
.arbol-n svg{background:var(--mesa);border-radius:10px;padding:4px}
@media (max-width:560px){.mut-cta{flex-direction:column;align-items:flex-start}.mut-fin{grid-template-columns:1fr}.vest-grande{max-width:260px;margin:0 auto}.vestidos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:var(--sunk);border-radius:14px;padding:18px 20px;margin:20px 0 0}
.body-res{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;align-items:center}
.night{background:var(--frame);border-radius:18px}
.geo{stroke-dasharray:100;stroke-dashoffset:100;fill-opacity:0;animation:trazo 1s ease-out .15s forwards}
@keyframes trazo{60%{fill-opacity:0}to{stroke-dashoffset:0;fill-opacity:.22}}
.silueta-in{animation:aparece .45s ease-out}
@keyframes aparece{from{opacity:.2;transform:scale(.97)}}
:root[data-theme="light"] .night{background:#d0dcd7}
.q{margin:0 0 20px}
.q p{font-weight:600;margin:0 0 10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.swatches span{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;color:var(--ink-muted)}
.swatches i,.dot{display:inline-block;width:18px;height:18px;border-radius:50%;border:1px solid rgba(127,127,127,.35)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--card-line)}
.counter:last-child{border-bottom:0}
.counter .ctl{display:flex;align-items:center;gap:6px}
.counter .ctl b{font-family:Gloock,serif;font-weight:400;font-size:22px;min-width:28px;text-align:center}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--field-line);background:transparent;color:var(--ink);font:20px/1 Literata,serif;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--gold);min-height:44px}
.switch{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--leaf);margin-top:2px;flex:none}
/* evolución */
.evo{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:center}
.evo .night{padding:14px}
.evo svg.flower{width:100%;height:auto;display:block}
.big{font-family:Gloock,serif;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.strip{display:flex;gap:4px;margin:12px 0}
.mas summary{cursor:pointer;color:var(--gold-ink);font-weight:600;min-height:44px;display:flex;align-items:center}
:root:not([data-theme="light"]) .mas summary{color:var(--gold)}
.strip i{flex:1;height:26px;border-radius:6px;border:1px solid rgba(127,127,127,.3)}
.legend{display:flex;gap:16px;font-size:14px;color:var(--frame-muted);margin-top:8px;justify-content:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.vs{background:var(--salvia);border-radius:14px;padding:18px 20px;margin-top:22px}
.vs h3{font-size:21px;margin-bottom:8px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:14px;margin-top:10px}
.bars .bar{height:12px;border-radius:999px;background:rgba(127,127,127,.18);overflow:hidden}
.bars .bar i{display:block;height:100%;border-radius:999px}
/* cápsula */
.garments{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;margin:8px 0 26px}
.g{border:1px solid var(--card-line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.mut-sello{color:var(--gold);font-size:18px;line-height:1}
.cupo{color:var(--gold-ink);margin:10px 0 0}
.mio{display:flex;gap:16px;align-items:center;border:1px solid var(--gold);border-radius:16px;padding:14px 16px;margin:0 0 18px}
.mio h3{margin:0 0 4px}
.mio p{margin:0 0 10px}
.mio-arte{flex:none}
:root:not([data-theme="light"]) .cupo{color:var(--gold)}
.resumen{margin-top:0}
.resumen p{margin:0}
.resumen p+p{margin-top:8px}
.cupo-linea .btn{margin-top:8px;display:flex}
.g .mut-nota{color:var(--gold-ink);font-weight:600}
:root:not([data-theme="light"]) .g .mut-nota{color:var(--gold)}
.g svg{width:72px;height:72px}
.hoja .g svg{width:96px;height:96px}
.g b{font-weight:600;font-size:15px;line-height:1.3}
.g small{color:var(--ink-muted);font-size:14px}
.g ul{margin:2px 0 0;padding-left:18px;font-size:14.5px}
.buscar{margin-top:auto;align-self:stretch;display:flex;justify-content:center;align-items:center;gap:6px;min-height:44px;padding:8px 10px;border:1px solid currentColor;border-radius:999px;color:var(--gold-ink);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.buscar:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
:root:not([data-theme="light"]) .buscar{color:var(--gold)}
.capsulas{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.capsulas li{background:var(--mesa);border-radius:22px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.45}
.capsulas li b{font-size:16px}.capsulas li span:last-child{color:var(--ink-muted)}
.cap-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--gold);color:var(--on-gold);margin-bottom:4px}
:root:not([data-theme="light"]) .capsulas li{background:var(--sunk)}
.occ h3{font-size:21px;margin:0 0 8px}
.occ ol{margin:0 0 22px;padding-left:22px}
.occ li{margin:6px 0}
.looks{list-style:none;padding:0;margin:0 0 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px}
.occ .look{margin:0;border:1px solid var(--card-line);border-radius:14px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:8px}
.look p{margin:0 4px;font-size:14.5px;line-height:1.4}
.look-arte{background:var(--mesa);border-radius:10px;padding:8px 4px;display:grid;grid-template-columns:1fr 1.6fr 1fr;grid-template-areas:"capa top ." "capa bot zap";align-items:center;justify-items:center;row-gap:0}
.look-arte.es-vestido{grid-template-areas:"capa ves ." "capa ves zap"}
.look-arte i{display:block}.look-arte svg{display:block;width:100%;height:auto}
.l-top{grid-area:top;width:62px}.l-bot{grid-area:bot;width:62px;margin-top:-6px}.l-ves{grid-area:ves;width:76px}
.l-capa{grid-area:capa;width:44px}.l-zap{grid-area:zap;width:40px;align-self:end}
.occ .dots{display:inline-flex;gap:3px;vertical-align:-3px;margin-right:6px}
.occ .dots .dot{width:14px;height:14px}
.total{display:flex;flex-wrap:wrap;gap:12px 28px;margin:0 0 22px}
.total div span{display:block;font-size:14.5px;color:var(--ink-muted)}
.foot{color:var(--frame-muted);font-size:14.5px;padding:8px 0 40px;max-width:46em}
.foot a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .card{padding:20px 18px}
  .card h2{font-size:23px}
  .grid3{grid-template-columns:1fr}
  .body-res,.evo{grid-template-columns:1fr}
  .body-res svg{max-width:150px;margin:0 auto;display:block}
  .nav{flex-direction:column-reverse}
  .nav .btn{width:100%}
  .brand .ser{display:none}
  .looks{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .occ .look{padding:6px 6px 8px;gap:6px}
  .look p{font-size:14px;margin:0 2px}
  .l-top,.l-bot{width:46px}.l-ves{width:56px}.l-capa{width:32px}.l-zap{width:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.geo{stroke-dashoffset:0;fill-opacity:.22}}
.mast{position:relative}
.steps{display:none}   /* sin barritas: el avance lo cuenta la liana, como en la app 1 */
.mast-vine{position:absolute;left:0;right:0;bottom:-8px;width:100%;height:16px;pointer-events:none}
.mast .steplabel{position:absolute;right:2px;bottom:-30px;margin:0;font-size:14px;font-weight:400;white-space:nowrap}
.mast .steplabel:empty{display:none}
.hero{margin-top:22px}
/* ---------- la introducción (15 nov 2026): cuatro escenas, el mismo formato de la app 1 ---------- */
.mast-intro{white-space:nowrap;min-height:44px;padding:6px 16px;border:1px solid var(--frame-line);border-radius:999px;background:transparent;color:var(--frame-text);font:600 14px Literata,serif;cursor:pointer}
.mast-intro .sh{display:none}@media (max-width:560px){.mast-intro .lg{display:none}.mast-intro .sh{display:inline}}
.mast .brand{margin-right:auto;white-space:nowrap}
.intro h2{font-size:clamp(23px,4.6vw,30px);line-height:1.18;margin:0 0 12px}.intro h2 em{font-style:normal;color:var(--gold-ink)}
.intro p{max-width:36em}
.intro-cover{display:grid;grid-template-columns:1fr auto;gap:10px 26px;align-items:center}
.intro-cover .vest{width:170px;background:var(--mesa);border-radius:18px;padding:10px 18px}
@media (max-width:560px){.intro-cover{grid-template-columns:1fr}.intro-cover .vest{width:150px;justify-self:center;grid-row:1}}
.intro-meta{font-size:14.5px;color:var(--ink-muted);margin:10px 0 0}
.intro-fila{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:14px 0}
.intro-fila figure{margin:0;text-align:center;font-size:14px;color:var(--ink-muted)}
.intro-fila figure svg{display:block;background:var(--mesa);border-radius:14px;padding:4px 8px;margin:0 auto 4px}
.intro-fila.familia{flex-wrap:nowrap;gap:6px}.intro-fila.familia figure svg{padding:3px 5px}
.intro-fila .x{font:22px Gloock,serif;color:var(--ink-muted);align-self:center}
.mult{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0}
.mult .box{background:var(--mesa);border-radius:14px;padding:8px 12px;text-align:center;min-width:66px}
.mult .box b{display:block;font:24px Gloock,serif}.mult .box span{font-size:14px;color:var(--ink-muted)}
.mult .x{font:20px Gloock,serif;color:var(--ink-muted)}
.intro-big{font:clamp(34px,8vw,52px) Gloock,serif;color:var(--gold-ink);line-height:1.05;margin:14px 0 2px}
.intro-goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}
.intro-goals div{background:var(--mesa);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.45}
.intro-goals b{font-size:16px}.intro-goals span{color:var(--ink-muted)}
:root:not([data-theme="light"]) .intro-goals div,:root:not([data-theme="light"]) .mult .box{background:var(--sunk)}
.intro-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--card-line)}
.intro-nav .btn{white-space:nowrap;padding:11px 18px}
.intro-dots{display:flex;gap:8px;align-items:center}.intro-dots i{width:11px;height:11px;border-radius:999px;background:var(--ink-muted);opacity:.5;transition:width .3s,opacity .3s}.intro-dots i.on{width:26px;background:var(--gold);opacity:1}
@media (prefers-reduced-motion:reduce){.intro-dots i{transition:none}}
.fuentes{margin:6px 0 0;font-size:14.5px;color:var(--ink-muted)}.fuentes summary{cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:10px;padding:0 16px;margin:4px 0 2px;border:1px solid var(--gold);border-radius:999px;font:600 14.5px Literata,serif;color:var(--gold-ink);list-style:none}
.fuentes summary::-webkit-details-marker{display:none}
.fuentes summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s ease-out}
.fuentes[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.fuentes summary:hover{background:color-mix(in srgb,var(--gold) 12%,transparent)}
:root:not([data-theme="light"]) .fuentes summary{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.fuentes summary::after{transition:none}}.fuentes ul{margin:4px 0 0;padding-left:18px}.fuentes li{margin:0 0 4px}.fuentes a{color:inherit}
  /* Día / noche: la misma cortina del jardín */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  :root[data-dir="to-day"]::view-transition-new(root) { animation: wipe-left 1.75s cubic-bezier(.77, 0, .175, 1) both; }
  :root[data-dir="to-night"]::view-transition-new(root) { animation: wipe-right 1.75s cubic-bezier(.77, 0, .175, 1) both; }
  @keyframes wipe-left { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes wipe-right { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
.priv-btn{background:none;border:0;padding:6px 0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.priv-btn:hover{color:var(--ink)}
dialog.priv{max-width:min(34em,calc(100vw - 32px));border:1px solid var(--card-line);border-radius:18px;background:var(--card);color:var(--ink);padding:22px 22px 18px}
dialog.priv::backdrop{background:rgba(0,0,0,.55)}
.priv h3{margin:0 0 12px;font:400 24px/1.15 Gloock,Georgia,serif}
.priv p{margin:0 0 10px;font-size:15px;line-height:1.5;color:var(--ink-muted)}
.priv p b{color:var(--ink);font-weight:600}
.priv .btn{margin-top:8px}
@media (max-width:640px){.nav .pills{flex-direction:column-reverse;width:100%}}   /* en el teléfono el botón dorado va primero (15 nov 2026) */
.pulgar{display:none}
@media (max-width:640px){   /* en el teléfono, «Siguiente generación» queda abajo, al alcance del pulgar, mientras eliges (15 nov 2026) */
  .pulgar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--card-line);transition:transform .25s ease-out}
  .pulgar .btn{width:100%}
  .pulgar.fuera{transform:translateY(110%)}
  body.con-pulgar{padding-bottom:76px}
}
@media (prefers-reduced-motion:reduce){.pulgar{transition:none}}
.compartir-fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 0}
.btn.compartir{display:inline-flex;align-items:center;gap:8px}
.c-ok{color:var(--leaf);font-size:14px;font-weight:600}

<script>
// ---- Contador de uso (GoatCounter): anónimo, sin cookies. El mismo de la semana de comidas (15 nov 2026) ----
// Solo cuenta visitas y pasos ("alguien llegó al final"). Nunca envía medidas, colores ni nada que la persona elige o escribe.
const GOATCOUNTER_CODE = 'designingspring';
if (GOATCOUNTER_CODE && !/^(localhost|127\.|\[::1\])/.test(location.hostname) && location.protocol !== 'file:') {
  const gc = document.createElement('script');
  gc.async = true; gc.src = 'https://gc.zgo.at/count.js';
  gc.dataset.goatcounter = `https://${GOATCOUNTER_CODE}.goatcounter.com/count`;
  document.head.appendChild(gc);
}
const trackedOnce = new Set();
// Cuenta una acción una sola vez por visita (para ver cuántas personas llegan a cada paso).
function track(name) {
  if (!GOATCOUNTER_CODE || trackedOnce.has(name)) return;
  trackedOnce.add(name);
  const send = () => window.goatcounter && window.goatcounter.count && window.goatcounter.count({ path: name, title: name, event: true });
  if (window.goatcounter && window.goatcounter.count) send(); else setTimeout(send, 1500);
}
</script>

function tipoCuerpo({busto,cintura,cadera}){
  if (cintura >= busto && cintura >= cadera) return 'óvalo';
  const dif = cadera - busto, marcada = cintura <= 0.78 * Math.min(busto, cadera);
  if (Math.abs(dif) <= 0.05 * cadera && marcada) return 'reloj de arena';
  if (dif > 0.05 * cadera) return 'triángulo';
  if (-dif > 0.05 * cadera) return 'triángulo invertido';
  return 'rectángulo';
}
function leQueda(p, m){
  if (p.rol === 'zapatos' || p.rol === 'accesorio') return true;
  const med = p.rol === 'abajo' ? ['cintura','cadera'] : p.rol === 'vestido' ? ['busto','cintura','cadera'] : ['busto'];
  const margen = p.corte.holgado ? 4 : 0, holgura = p.corte.cenido ? 6 : 99;
  return p.tallas.some(x => med.every(k => m[k] <= TALLAS[x][k][1] + margen && m[k] >= TALLAS[x][k][0] - holgura - margen));
}
// cada sugerencia: [puntos, etiqueta de por qué]
function sugerencias(p, tipo){
  const c = p.corte, r = [];
  const add = (n, k) => r.push([n, k]);
  if (tipo === 'reloj de arena'){ if (c.cint || c.cinturon) add(2,'cint'); if (c.holgado && p.rol !== 'capa') add(-1); }
  if (tipo === 'triángulo'){ if (p.rol==='arriba' && c.volArriba) add(2,'volArriba'); if (c.lineaA) add(1,'lineaA'); if (c.volCadera) add(-2); if (p.rol==='abajo' && c.cenido) add(-1); }
  if (tipo === 'triángulo invertido'){ if (p.rol==='arriba' && c.volArriba) add(-2); if (c.v) add(1,'v'); if (p.rol==='abajo' && (c.volAbajo||c.lineaA||c.volCadera)) add(2, c.lineaA ? 'lineaA' : 'volAbajo'); }
  if (tipo === 'rectángulo'){ if (c.cint || c.cinturon) add(1,'cint'); if (c.volCadera) add(1,'volCadera'); if (p.rol==='capa') add(1,'capa'); }
  if (tipo === 'óvalo'){ if (c.v) add(2,'v'); if (c.largo || c.alarga) add(1,'largo'); if (c.cenido) add(-1); }
  return r;
}

function mezcla(q){
  const css = getComputedStyle(document.documentElement), a = css.getPropertyValue('--seed-low').trim(), b = css.getPropertyValue('--gold').trim();
  const pa = [1,3,5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1,3,5].map(i => parseInt(b.substr(i, 2), 16));

}

var pulgarObs = null;   // var: render() la usa antes de llegar a esta línea
function pulgar(orig){
  const bar = document.getElementById('pulgar'), b = bar.firstElementChild;
  if (pulgarObs) pulgarObs.disconnect();
  if (!orig){ bar.classList.add('fuera'); document.body.classList.remove('con-pulgar'); return; }
  b.textContent = orig.textContent; b.disabled = orig.disabled; if (orig.hasAttribute('aria-disabled')) b.setAttribute('aria-disabled', orig.getAttribute('aria-disabled')); else b.removeAttribute('aria-disabled');
  b.onclick = () => orig.click();

  pulgarObs = new IntersectionObserver(es => bar.classList.toggle('fuera', es[0].isIntersecting), { rootMargin: '0px 0px -80px 0px' });
  pulgarObs.observe(orig);
}

async function compartir(btn, texto, url, ev) {
  if (typeof track === 'function') track(ev);
  const en = (typeof LANG !== 'undefined' && LANG === 'en');
  if (navigator.share) { try { await navigator.share({ title: document.title, text: texto, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = url; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();
  }
  const s = btn.parentElement.querySelector('.c-ok'); if (!s) return;
  s.textContent = ok ? (en ? '✓ Link copied' : '✓ Enlace copiado') : url;
  clearTimeout(s._t); s._t = setTimeout(() => { s.textContent = ''; }, 3500);
